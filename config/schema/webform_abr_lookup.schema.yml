webform_abr_lookup.settings:
  type: config_object
  label: 'Webform ABN Lookup settings'
  mapping:
    abr_key_id:
      type: string
      label: 'ABR Authentication Key ID'
    abr_base_url:
      type: string
      label: 'ABR API Base URL'
    cache_duration:
      type: integer
      label: 'Cache duration in seconds'
    default_lookup_type:
      type: string
      label: 'Default lookup type'
    default_auto_populate:
      type: boolean
      label: 'Default auto-populate setting'
    default_show_details:
      type: boolean
      label: 'Default show details setting'